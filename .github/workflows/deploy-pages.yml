name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PHOTOAGING_VISUALIZER_DEPLOY_KEY }}

      - name: Get photoaging submodule SHA
        id: photo-sha
        run: |
          echo "sha=$(git -C apps/photoaging-visualizer rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache photoaging dist
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: apps/photoaging-visualizer/dist
          key: photoaging-dist-${{ steps.photo-sha.outputs.sha }}-${{ hashFiles('apps/photoaging-visualizer/package-lock.json') }}

      - name: Set up Node
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/photoaging-visualizer/package-lock.json

      - name: Build photoaging visualizer
        if: steps.dist-cache.outputs.cache-hit != 'true'
        working-directory: apps/photoaging-visualizer
        run: |
          npm ci
          VITE_BASE_PATH=/photoaging-visualizer/ npm run build

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true

      - name: Add photoaging visualizer
        run: |
          sudo mkdir -p _site/photoaging-visualizer
          sudo cp -R apps/photoaging-visualizer/dist/. _site/photoaging-visualizer/
          sudo chown -R "$USER:$USER" _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
