# ─────────────────────────────────────────────────────────────────────
#  SF spots — visited status (single source of truth for sghose.me)
#
#  The map pages fetch this file on every load and colour their lists /
#  markers from it, so this is the ONLY place to mark a spot visited.
#  (The posts keep a baked-in default that is used only while loading or
#  if this file cannot be fetched.)
#
#    https://sghose.me/sandwich-spots/   →  sandwiches:
#    https://sghose.me/hot-chocolate/    →  hot_chocolate:
#
#  Format:   <spot key>: <status>
#    visited   (also accepts: yes / true / done / x)
#    notyet    (also accepts: no / false / todo / pending)
#    unknown   (also accepts: ? / unconfirmed)     ← hot chocolate only
#
#  Keys must match the `key` of the spot in the post. Anything after a #
#  is a comment, so feel free to add dates / notes, e.g.
#      oceansubs: visited   # 2026-10-12, get the Italian
#  Spots missing from this file fall back to the default in the post.
#
#  Where it lives: for now this file is served from the repo at
#  /data/sf-spots-visited-status.yml (edits go live on the next deploy).
#  To move it to a secret gist instead, create the gist with this same
#  filename and point SOURCE_URL / EDIT_URL in js/visited-status.js at it.
# ─────────────────────────────────────────────────────────────────────

