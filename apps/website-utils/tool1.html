  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Collage | Website Utils</title>
  <meta name="description" content="Create beautiful image collages with ease. Paste your images, arrange them, and generate your collage as a downloadable image." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* page-specific: collage grid + tiles */
    .grid { display: grid; gap: 16px; width: 100%; padding-bottom: 4px; }
    .grid.horizontal { grid-auto-flow: column; grid-auto-columns: max-content; }
    .grid.vertical { grid-auto-flow: row; grid-auto-rows: max-content; }
    .tile { position: relative; width: fit-content; height: fit-content; }
    .tile.dragging { opacity: 0.4; }
    .tile img.tile-img {
      max-width: 200px; max-height: 200px; object-fit: cover; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); display: block; cursor: grab;
    }
    .tile .remove {
      position: absolute; top: 0; right: 0; background: #ef4444; color: #fff; border: none;
      border-bottom-left-radius: 8px; padding: 4px 10px; font-size: 16px; line-height: 1; cursor: pointer;
      opacity: 0; transition: opacity 0.15s; border-top-right-radius: 8px;
    }
    .tile:hover .remove { opacity: 1; }
    .empty-hint { text-align: center; color: #97a3b8; font-size: 0.85rem; margin: 24px 0 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="tool1.html" class="active">Image Collage</a></li>
        <li><a href="tool2.html">Video to GIF Converter</a></li>
        <li><a href="tool3.html">Log Sanitizer</a></li>
        <li><a href="tool4.html">MMS Image Resizer</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="hero">
      <div class="hero-icon">&#128444;&#65039;</div>
      <h2 class="title">Image Collage Creator</h2>
      <p class="tagline">Paste images, arrange them, generate a collage.</p>
    </div>

      <div class="card">
        <div class="controls">
          <label class="sr-only" for="layout">Select layout</label>
          <select id="layout" class="select-layout" aria-label="Select layout">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
          </select>
          <button id="generate" class="btn btn-blue">Generate Collage</button>
        </div>

        <div id="dropzone" class="dropzone" tabindex="0">
          <p id="dropzoneText" class="drop-hint">Paste your images here or drag and drop image files to add them</p>
          <div id="grid" class="grid horizontal"></div>
        </div>

        <div id="result" class="result" hidden>
          <h3>Generated Collage</h3>
          <img id="preview" alt="Generated Collage" />
          <div class="result-actions">
            <button id="download" class="btn btn-green">Download Collage</button>
            <button id="copy" class="btn btn-purple">Copy to Clipboard</button>
          </div>
        </div>

        <canvas id="canvas" style="display:none"></canvas>
      </div>
  </main>

  <div id="toastWrap" class="toast-wrap"></div>

  <script>
    (function () {
      "use strict";

      var state = {
        images: [],              // [{ id, dataUrl }]
        layout: "horizontal",    // "horizontal" | "vertical"
        generated: null,         // dataURL of generated collage
        dragging: null           // id of tile being dragged (for reorder)
      };

      var el = {
        layout: document.getElementById("layout"),
        generate: document.getElementById("generate"),
        dropzone: document.getElementById("dropzone"),
        dropText: document.getElementById("dropzoneText"),
        grid: document.getElementById("grid"),
        result: document.getElementById("result"),
        preview: document.getElementById("preview"),
        download: document.getElementById("download"),
        copy: document.getElementById("copy"),
        canvas: document.getElementById("canvas"),
      };

      function showToast(message, type) {
        var wrap = document.getElementById("toastWrap");
        var t = document.createElement("div");
        t.className = "toast" + (type ? " " + type : "");
        t.textContent = message;
        wrap.appendChild(t);
        requestAnimationFrame(function () { t.classList.add("show"); });
        setTimeout(function () {
          t.classList.remove("show");
          setTimeout(function () { t.remove(); }, 250);
        }, 4000);
      }

      function layoutClass() {
        return state.layout === "horizontal" ? "horizontal" : "vertical";
      }

      function render() {
        el.layout.value = state.layout;
        el.grid.className = "grid " + layoutClass();
        el.grid.innerHTML = "";

        if (state.images.length === 0) {
          el.grid.innerHTML = '<p class="empty-hint">No images added yet.</p>';
          return;
        }

        state.images.forEach(function (img, i) {
          var tile = document.createElement("div");
          tile.className = "tile";
          tile.draggable = true;

          var im = document.createElement("img");
          im.className = "tile-img";
          im.src = img.dataUrl;
          im.alt = "Image " + (i + 1);

          var rm = document.createElement("button");
          rm.type = "button";
          rm.className = "remove";
          rm.setAttribute("aria-label", "Remove image");
          rm.textContent = "\u00d7";
          rm.addEventListener("click", function () {
            state.images = state.images.filter(function (t) { return t.id !== img.id; });
            render();
          });

          // --- drag to reorder (HTML5 DnD) ---
          tile.addEventListener("dragstart", function (e) {
            state.dragging = i;
            tile.classList.add("dragging");
            try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", img.id); } catch (err) {}
          });
          tile.addEventListener("dragend", function () {
            tile.classList.remove("dragging");
            state.dragging = null;
            render();
          });
          tile.addEventListener("dragover", function (e) {
            e.preventDefault();
            if (state.dragging === null) return;
            e.dataTransfer.dropEffect = "move";
            var rect = tile.getBoundingClientRect();
            var targetIndex;
            if (state.layout === "horizontal") {
              targetIndex = e.clientX < rect.left + rect.width / 2 ? i : i + 1;
            } else {
              targetIndex = e.clientY < rect.top + rect.height / 2 ? i : i + 1;
            }
            // offset when moving forward
            if (state.dragging < targetIndex) targetIndex -= 1;
            move(state.dragging, clampIndex(targetIndex));
          });
          tile.addEventListener("drop", function (e) { e.preventDefault(); });

          tile.appendChild(im);
          tile.appendChild(rm);
          el.grid.appendChild(tile);
        });
      }

      function clampIndex(n) { return Math.max(0, Math.min(state.images.length - 1, n)); }

      function move(from, to) {
        if (from === to) return;
        var arr = state.images.slice();
        var removed = arr.splice(from, 1)[0];
        arr.splice(to, 0, removed);
        state.images = arr;
      }

      var dropDepth = 0;
      el.dropzone.addEventListener("dragenter", function (e) {
        e.preventDefault(); e.stopPropagation();
        dropDepth++;
        el.dropzone.classList.add("over");
        el.dropText.textContent = "Drop images here";
      });
      el.dropzone.addEventListener("dragover", function (e) {
        e.preventDefault(); e.stopPropagation();
      });
      el.dropzone.addEventListener("dragleave", function (e) {
        e.preventDefault(); e.stopPropagation();
        dropDepth--;
        if (dropDepth <= 0) { dropDepth = 0; el.dropzone.classList.remove("over"); el.dropText.textContent = "Paste your images here or drag and drop image files to add them"; }
      });
      el.dropzone.addEventListener("drop", function (e) {
        e.preventDefault(); e.stopPropagation();
        dropDepth = 0;
        el.dropzone.classList.remove("over");
        el.dropText.textContent = "Paste your images here or drag and drop image files to add them";
        var files = Array.prototype.filter.call(e.dataTransfer.files, function (f) { return f.type.startsWith("image"); });
        if (files.length === 0) {
          showToast("Please drop image files only.", "error");
        } else {
          files.forEach(function (f, idx) { readAsDataURL(f, idx); });
        }
      });

      el.dropzone.addEventListener("paste", function (e) {
        var items = Array.prototype.slice.call(e.clipboardData.items).filter(function (it) { return it.type.indexOf("image") === 0; });
        items.forEach(function (it, idx) {
          var f = it.getAsFile();
          if (f) addFile(f, idx);
        });
      });

      function readAsDataURL(file, idx) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          var result = ev.target ? ev.target.result : null;
          if (typeof result === "string") addImage(result, idx);
        };
        reader.readAsDataURL(file);
      }

      function addFile(file, idx) { readAsDataURL(file, idx); }

      function addImage(dataUrl, idx) {
        state.images.push({ id: "image-" + Date.now() + "-" + idx, dataUrl: dataUrl });
        render();
      }

      el.layout.addEventListener("change", function () {
        state.layout = el.layout.value;
        render();
      });

      function generate() {
        if (state.images.length === 0 || !el.canvas) return;
        var ctx = el.canvas.getContext("2d");
        if (!ctx) return;
        var imgs = state.images.map(function (x) { var im = new Image(); im.src = x.dataUrl; return im; });

        Promise.all(imgs.map(function (im) { return im.decode(); })).then(function () {
          var acc = imgs.reduce(function (o, t) {
            return {
              totalWidth: o.totalWidth + t.width,
              totalHeight: o.totalHeight + t.height,
              maxWidth: Math.max(o.maxWidth, t.width),
              maxHeight: Math.max(o.maxHeight, t.height)
            };
          }, { totalWidth: 0, totalHeight: 0, maxWidth: 0, maxHeight: 0 });

          var width, height, scale;
          if (state.layout === "horizontal") {
            scale = (Math.min(acc.totalWidth + 20 * (imgs.length + 1), 2000) - 20 * (imgs.length + 1)) / acc.totalWidth;
            height = Math.max.apply(null, imgs.map(function (im) { return im.height * scale; })) + 40;
            width = Math.min(acc.totalWidth + 20 * (imgs.length + 1), 2000);
          } else {
            scale = (Math.min(acc.totalHeight + 20 * (imgs.length + 1), 2000) - 20 * (imgs.length + 1)) / acc.totalHeight;
            width = Math.max.apply(null, imgs.map(function (im) { return im.width * scale; })) + 40;
            height = Math.min(acc.totalHeight + 20 * (imgs.length + 1), 2000);
          }

          if (width > 2000) {
            var ew = 2000 / width;
            width = 2000; height *= ew; scale *= ew;
          } else if (height > 2000) {
            var eh = 2000 / height;
            height = 2000; width *= eh; scale *= eh;
          }

          el.canvas.width = width;
          el.canvas.height = height;
          ctx.fillStyle = "white";
          ctx.fillRect(0, 0, width, height);

          var padLeft = 20, padTop = 20;
          imgs.forEach(function (im) {
            var w = im.width * scale;
            var h = im.height * scale;
            var x = padLeft, y = padTop;
            if (state.layout === "horizontal") { y = (height - h) / 2; }
            else { x = (width - w) / 2; }
            ctx.drawImage(im, x, y, w, h);
            if (state.layout === "horizontal") { padLeft += w + 20; }
            else { padTop += h + 20; }
          });

          state.generated = el.canvas.toDataURL("image/png");
          el.preview.src = state.generated;
          el.result.hidden = false;
        });
      }
      el.generate.addEventListener("click", generate);

      el.download.addEventListener("click", function () {
        if (state.generated) {
          var a = document.createElement("a");
          a.download = "collage.png";
          a.href = state.generated;
          a.click();
        }
      });

      el.copy.addEventListener("click", function () {
        if (!state.generated) { showToast("No stack available to copy.", "error"); return; }
        fetch(state.generated)
          .then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.blob(); })
          .then(function (blob) {
            return navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          })
          .then(function () { showToast("Collage copied to clipboard!", "success"); })
          .catch(function (err) {
            console.error("Copy to clipboard failed:", err);
            showToast(err instanceof Error ? err.message : "Unknown error occurred", "error");
          });
      });

      render();
    })();
  </script>
</body>
</html>
